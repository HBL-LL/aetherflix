name: AetherFlix Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release draft with artifacts"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Smart TV & Web Build ────────────────────────────────────────────────────
  build-tv-web:
    name: Build Smart TV (Android APK & Tizen WGT) + Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Build Samsung Tizen TV Package (.wgt)
        run: npm run build:tizen

      - name: Setup Android TV Project
        run: node scripts/setup-android.js

      - name: Build Android TV Release APK (.apk)
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/AetherFlix.apk || cp android/app/build/outputs/apk/release/*.apk dist/AetherFlix.apk

      - name: Upload Smart TV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-tv-packages
          path: |
            dist/AetherFlix.apk
            dist/AetherFlix.wgt

  # ── Desktop macOS Build ─────────────────────────────────────────────────────
  build-macos:
    name: Build Desktop macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Universal DMG & ZIP
        run: npm run dist:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-artifacts
          path: |
            dist/*.dmg
            dist/*.zip

  # ── Desktop Linux Build ─────────────────────────────────────────────────────
  build-linux:
    name: Build Desktop Linux (AppImage, DEB, RPM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies for AppImage / RPM
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  # ── Desktop Windows Build ───────────────────────────────────────────────────
  build-windows:
    name: Build Desktop Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-artifacts
          path: |
            dist/*.exe

  # ── Release Publication ─────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-tv-web, build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets directory
        run: |
          mkdir -p final-assets
          find release-artifacts -type f \( -name "*.apk" -o -name "*.wgt" -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} final-assets/ \;
          ls -lah final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
