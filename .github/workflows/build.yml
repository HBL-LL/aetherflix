name: AetherFlix Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release draft with artifacts"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Existing tag to attach the release to (e.g. v1.1.0)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # ── Smart TV & Web Build ────────────────────────────────────────────────────
  build-tv-web:
    name: Build Smart TV (Android APK & Tizen WGT) + Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Build Samsung Tizen TV Package (.wgt)
        run: npm run build:tizen

      - name: Setup Android TV Project
        run: node scripts/setup-android.js

      - name: Build Android TV Release APK (.apk)
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/AetherFlix.apk || cp android/app/build/outputs/apk/release/*.apk dist/AetherFlix.apk

      - name: Upload Smart TV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-tv-packages
          path: |
            dist/AetherFlix.apk
            dist/AetherFlix.wgt

  # ── Desktop macOS Build ─────────────────────────────────────────────────────
  build-macos:
    name: Build Desktop macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build macOS Universal DMG & ZIP
        run: npm run dist:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-artifacts
          path: |
            dist/*.dmg
            dist/*.zip

  # ── Desktop Linux Build ─────────────────────────────────────────────────────
  build-linux:
    name: Build Desktop Linux (AppImage, DEB, RPM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies for AppImage / RPM / Pacman
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman

  # ── Desktop Windows Build ───────────────────────────────────────────────────
  build-windows:
    name: Build Desktop Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-artifacts
          path: |
            dist/*.exe

  # ── Docker Container Release (GHCR) ──────────────────────────────────────────
  build-docker:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release Publication ─────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-tv-web, build-macos, build-linux, build-windows, build-docker]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the app packages: downloading everything also pulls the Docker
      # build-record artifact, which fails to download and blocks the release.
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-desktop-artifacts"
          path: release-artifacts

      - name: Download Smart TV packages
        uses: actions/download-artifact@v4
        with:
          name: smart-tv-packages
          path: release-artifacts/smart-tv-packages

      - name: Prepare release assets directory
        run: |
          mkdir -p final-assets
          find release-artifacts -type f \( -name "*.apk" -o -name "*.wgt" -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pacman" \) -exec cp {} final-assets/ \;
          cp docker-compose.yml final-assets/
          ls -lah final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: final-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
