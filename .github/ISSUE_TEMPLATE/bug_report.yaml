name: Bug Report
description: Report an issue or unexpected behavior that occurs within AetherFlix
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **README: Before You Submit Your Issue**
        - For general questions or discussions, please use the [Discussions page](https://github.com/HBL-LL/aetherflix/discussions).
        - Verify that you are running the latest version before reporting.
  - type: checkboxes
    attributes:
      label: Guidelines
      description: Please ensure you've completed all of the following.
      options:
        - label: I have encountered this bug in the [latest release of AetherFlix](https://github.com/HBL-LL/aetherflix/releases).
          required: true
        - label: I have [searched the issue tracker for open and closed issues](https://github.com/HBL-LL/aetherflix/issues?q=is%3Aissue+sort%3Arelevance-desc) that are similar to the bug report I want to file, without success.
          required: true
        - label: This issue contains only one bug.
          required: true
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: |
        1. Open AetherFlix
        2. Navigate to '...' using TV remote / mouse / keyboard
        3. Click / press OK on '....'
        4. See error
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: "Platform / Target Device"
      description: Which platform or device did you encounter this issue on?
      multiple: true
      options:
        - Android TV / Google TV
        - Amazon Fire TV
        - Samsung Smart TV (Tizen OS)
        - Web App / Docker (Browser)
        - macOS (Desktop)
        - Windows (Desktop)
        - Linux (Desktop)
    validations:
      required: true
  - type: dropdown
    attributes:
      label: "Issue Category"
      description: Please select a label that fits this bug report. Choose multiple, if applicable.
      multiple: true
      options:
        - video playback / streaming failure
        - D-pad / TV remote navigation
        - subtitles download / parsing
        - adblock / pop-up blocking
        - audio / video sync
        - UI / layout / font display
        - app crash / freeze
        - performance / stutter
        - search / metadata not loading
        - download / offline playback
    validations:
      required: true
  - type: input
    attributes:
      label: AetherFlix Version
      description: Enter the version of AetherFlix you are running (check in Settings).
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: Device & OS Version
      description: Device model and OS version (e.g., Chromecast with Google TV Android 12, Samsung QLED Tizen 6.5, macOS Sequoia 15.3, Windows 11, etc.).
      placeholder: "e.g. Sony Bravia Android TV 11, Fire TV Stick 4K Max, macOS 15, Windows 11"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation / Package Type
      description: Which package or build did you use?
      options:
        - Android TV APK (.apk)
        - Samsung Tizen WGT (.wgt)
        - Docker Container (ghcr.io / local docker-compose)
        - Web App (node server.js / Vite)
        - macOS DMG / ZIP (.dmg)
        - Windows Installer (.exe)
        - Linux AppImage / DEB / RPM / Arch (.AppImage, .deb, .rpm, .pacman)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Streaming Source & Content
      description: If this issue is related to specific movies, series, anime, or video sources, please provide details.
      placeholder: "Source: VidSrc / SuperEmbed / AllManga / etc. | Title: ..."
    validations:
      required: false
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots or videos
      description: If applicable, add screenshots or photos of your TV/screen to help explain your problem.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Logs & Additional Information
      description: |
        Add browser console logs, server terminal logs, or any other context.
    validations:
      required: false
